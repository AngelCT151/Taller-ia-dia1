<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(209, 5, 5, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 47, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3em;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #ff00ff;
            margin-bottom: 10px;
            color: #00ffff;
            letter-spacing: 2px;
            animation: neonGlow 2s ease-in-out infinite;
        }

        @keyframes neonGlow {
            0%, 100% {
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #ff00ff;
            }
            50% {
                text-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff, 0 0 40px #ff00ff, 0 0 50px #ff00ff;
            }
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #pokemon-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #00ffff;
            border-radius: 50px;
            background: rgba(10, 14, 39, 0.8);
            color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        #pokemon-input:focus {
            outline: none;
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 30px rgba(255, 0, 255, 0.6), inset 0 0 10px rgba(0, 255, 255, 0.2);
            transform: scale(1.02);
        }

        #pokemon-input::placeholder {
            color: #00ffff;
            opacity: 0.5;
        }

        .search-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            color: #000;
            border: 2px solid #00ffff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), 0 0 25px rgba(255, 0, 255, 0.6);
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8), 0 0 35px rgba(255, 0, 255, 0.8);
            border-color: #ff00ff;
        }

        .search-btn:active {
            transform: translateY(0);
        }

        #loading {
            display: none;
            text-align: center;
            color: white;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #pokemon-card {
            display: none;
            background: linear-gradient(135deg, rgba(10, 10, 30, 0.95) 0%, rgba(20, 15, 45, 0.95) 100%);
            border-radius: 25px;
            box-shadow: 
                0 0 30px rgba(30, 120, 200, 0.5),
                0 0 60px rgba(255, 0, 100, 0.3),
                0 0 90px rgba(30, 120, 200, 0.2);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
            border: 3px solid;
            border-image: linear-gradient(135deg, #1E78C8 0%, #FF0064 100%) 1;
            position: relative;
        }

        #pokemon-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(30, 120, 200, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(255, 0, 100, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pokemon-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .pokemon-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
        }

        .pokemon-image {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(30, 120, 200, 0.3) 0%, rgba(255, 0, 100, 0.2) 100%);
            border-radius: 20px;
            padding: 20px;
            min-height: 300px;
            border: 3px solid;
            border-image: linear-gradient(135deg, #1E78C8 0%, #FF0064 100%) 1;
            box-shadow: 
                0 0 30px rgba(30, 120, 200, 0.5),
                inset 0 0 30px rgba(255, 0, 100, 0.2),
                0 0 60px rgba(255, 0, 100, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .pokemon-image::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(30, 120, 200, 0.1) 90deg, transparent 360deg);
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pokemon-image:hover {
            box-shadow: 
                0 0 50px rgba(30, 120, 200, 0.8),
                inset 0 0 40px rgba(255, 0, 100, 0.3),
                0 0 80px rgba(255, 0, 100, 0.5);
            transform: scale(1.02);
        }

        .pokemon-image img {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(30, 120, 200, 0.8)) drop-shadow(0 0 25px rgba(255, 0, 100, 0.6));
            position: relative;
            z-index: 1;
            transition: filter 0.3s ease;
        }

        .pokemon-image:hover img {
            filter: drop-shadow(0 0 25px rgba(30, 120, 200, 1)) drop-shadow(0 0 35px rgba(255, 0, 100, 0.8)) brightness(1.1);
        }

        .pokemon-info h2 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #1E78C8 0%, #FF0064 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            text-shadow: none;
            letter-spacing: 2px;
            animation: colorShift 3s ease-in-out infinite;
        }

        @keyframes colorShift {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(30, 120, 200, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(255, 0, 100, 0.6));
            }
        }

        .pokemon-id {
            color: #FF0064;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #FF0064, 0 0 20px rgba(255, 0, 100, 0.4);
            font-size: 1.1em;
        }

        .pokemon-tipo {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tipo {
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            border: 2px solid;
        }

        .tipo.normal { background: #A8A878; border-color: #d4d4a6; box-shadow: 0 0 10px rgba(168, 168, 120, 0.6); }
        .tipo.fire { background: #F08030; border-color: #ffaa60; box-shadow: 0 0 10px rgba(240, 128, 48, 0.6); }
        .tipo.water { background: #6890F0; border-color: #98b8ff; box-shadow: 0 0 10px rgba(104, 144, 240, 0.6); }
        .tipo.grass { background: #78C850; border-color: #a8e880; box-shadow: 0 0 10px rgba(120, 200, 80, 0.6); }
        .tipo.electric { background: #F8D030; color: #333; border-color: #ffff60; box-shadow: 0 0 10px rgba(248, 208, 48, 0.6); }
        .tipo.ice { background: #98D8D8; color: #333; border-color: #c8ffff; box-shadow: 0 0 10px rgba(152, 216, 216, 0.6); }
        .tipo.fighting { background: #C03028; border-color: #ff6060; box-shadow: 0 0 10px rgba(192, 48, 40, 0.6); }
        .tipo.poison { background: #A040A0; border-color: #d870d0; box-shadow: 0 0 10px rgba(160, 64, 160, 0.6); }
        .tipo.ground { background: #E0C068; color: #333; border-color: #ffff98; box-shadow: 0 0 10px rgba(224, 192, 104, 0.6); }
        .tipo.flying { background: #A890F0; border-color: #d8b8ff; box-shadow: 0 0 10px rgba(168, 144, 240, 0.6); }
        .tipo.psychic { background: #F85888; border-color: #ff88b8; box-shadow: 0 0 10px rgba(248, 88, 136, 0.6); }
        .tipo.bug { background: #A8B820; border-color: #d8e850; box-shadow: 0 0 10px rgba(168, 184, 32, 0.6); }
        .tipo.rock { background: #B8A038; border-color: #e8d068; box-shadow: 0 0 10px rgba(184, 160, 56, 0.6); }
        .tipo.ghost { background: #705898; border-color: #a878c8; box-shadow: 0 0 10px rgba(112, 88, 152, 0.6); }
        .tipo.dragon { background: #7038F8; border-color: #a868ff; box-shadow: 0 0 10px rgba(112, 56, 248, 0.6); }
        .tipo.dark { background: #705848; border-color: #a08878; box-shadow: 0 0 10px rgba(112, 88, 72, 0.6); }
        .tipo.steel { background: #B8B8D0; color: #333; border-color: #e8e8ff; box-shadow: 0 0 10px rgba(184, 184, 208, 0.6); }
        .tipo.fairy { background: #EE99AC; border-color: #ffb8d8; box-shadow: 0 0 10px rgba(238, 153, 172, 0.6); }

        .pokemon-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, #1E78C8 0%, #FF0064 100%) 1;
        }

        .detail {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, rgba(30, 120, 200, 0.2) 0%, rgba(255, 0, 100, 0.15) 100%);
            border-radius: 12px;
            border: 2px solid rgba(30, 120, 200, 0.4);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .detail::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .detail:hover {
            box-shadow: 
                0 0 20px rgba(30, 120, 200, 0.6),
                inset 0 0 15px rgba(255, 0, 100, 0.2);
            border-color: rgba(255, 0, 100, 0.6);
            transform: translateY(-3px);
        }

        .detail:hover::before {
            transform: translateX(100%);
        }

        .detail-label {
            display: block;
            color: #1E78C8;
            font-size: 0.85em;
            margin-bottom: 8px;
            text-shadow: 0 0 5px rgba(30, 120, 200, 0.6);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-value {
            display: block;
            color: #FF0064;
            font-weight: bold;
            font-size: 1.3em;
            text-shadow: 0 0 8px #FF0064, 0 0 15px rgba(255, 0, 100, 0.5);
        }

        .pokemon-stats {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(30, 120, 200, 0.15) 0%, rgba(255, 0, 100, 0.1) 100%);
            border-radius: 15px;
            border: 2px solid rgba(30, 120, 200, 0.3);
            position: relative;
            overflow: hidden;
        }

        .pokemon-stats::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 0, 100, 0.1) 50%, transparent 100%);
            pointer-events: none;
        }

        .pokemon-stats h3 {
            color: #1E78C8;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-shadow: 0 0 10px rgba(30, 120, 200, 0.8), 0 0 20px rgba(255, 0, 100, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            display: grid;
            grid-template-columns: 120px 1fr 50px;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            padding: 10px;
            border-radius: 8px;
            background: rgba(30, 120, 200, 0.1);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(255, 0, 100, 0.15);
            transform: translateX(5px);
        }

        .stat-name {
            font-weight: bold;
            color: #1E78C8;
            font-size: 0.9em;
            text-shadow: 0 0 5px rgba(30, 120, 200, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-bar {
            background: rgba(30, 120, 200, 0.2);
            border-radius: 10px;
            height: 28px;
            overflow: hidden;
            border: 1px solid rgba(30, 120, 200, 0.4);
            position: relative;
        }

        .stat-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
            animation: shimmerBar 2s ease-in-out infinite;
        }

        @keyframes shimmerBar {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .stat-value {
            height: 100%;
            background: linear-gradient(90deg, #1E78C8 0%, #FF0064 100%);
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 
                0 0 10px rgba(30, 120, 200, 0.8),
                inset 0 0 8px rgba(255, 0, 100, 0.5),
                0 0 20px rgba(255, 0, 100, 0.3);
            position: relative;
        }

        .stat-number {
            text-align: right;
            font-weight: bold;
            color: #FF0064;
            font-size: 0.9em;
            text-shadow: 0 0 8px #FF0064;
        }

        .error-message {
            padding: 40px;
            text-align: center;
            background: rgba(20, 20, 50, 0.9);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), 0 0 40px rgba(255, 0, 0, 0.3);
            border: 2px solid rgba(255, 0, 0, 0.5);
        }

        .error-message p {
            color: #00ffff;
            font-size: 1.2em;
            margin: 10px 0;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .error-message p:first-child {
            color: #ff0055;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0055;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 POKÉDEX 🔴</h1>
            <p>Busca tu Pokémon favorito y descubre sus características</p>
        </div>

        <div class="search-box">
            <input 
                type="text" 
                id="pokemon-input" 
                placeholder="Ej: pikachu, charizard, dragonite..."
                autocomplete="off"
            >
            <button class="search-btn" onclick="buscarPokemon()">Buscar</button>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>Buscando Pokémon...</p>
        </div>

        <div id="pokemon-card"></div>
    </div>

    <script src="api.js"></script>
</body>
</html>
