<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #pokemon-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        #pokemon-input:focus {
            outline: none;
            transform: scale(1.02);
        }

        #pokemon-input::placeholder {
            color: #999;
        }

        .search-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        #loading {
            display: none;
            text-align: center;
            color: white;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #pokemon-card {
            display: none;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pokemon-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .pokemon-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
        }

        .pokemon-image {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
        }

        .pokemon-image img {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        .pokemon-info h2 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 5px;
        }

        .pokemon-id {
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .pokemon-tipo {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tipo {
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .tipo.normal { background: #A8A878; }
        .tipo.fire { background: #F08030; }
        .tipo.water { background: #6890F0; }
        .tipo.grass { background: #78C850; }
        .tipo.electric { background: #F8D030; color: #333; }
        .tipo.ice { background: #98D8D8; color: #333; }
        .tipo.fighting { background: #C03028; }
        .tipo.poison { background: #A040A0; }
        .tipo.ground { background: #E0C068; color: #333; }
        .tipo.flying { background: #A890F0; }
        .tipo.psychic { background: #F85888; }
        .tipo.bug { background: #A8B820; }
        .tipo.rock { background: #B8A038; }
        .tipo.ghost { background: #705898; }
        .tipo.dragon { background: #7038F8; }
        .tipo.dark { background: #705848; }
        .tipo.steel { background: #B8B8D0; color: #333; }
        .tipo.fairy { background: #EE99AC; }

        .pokemon-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .detail {
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .detail-label {
            display: block;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .detail-value {
            display: block;
            color: #333;
            font-weight: bold;
            font-size: 1.1em;
        }

        .pokemon-stats {
            margin-top: 20px;
        }

        .pokemon-stats h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .stat-item {
            display: grid;
            grid-template-columns: 120px 1fr 50px;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-name {
            font-weight: bold;
            color: #555;
            font-size: 0.9em;
        }

        .stat-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
        }

        .stat-value {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .stat-number {
            text-align: right;
            font-weight: bold;
            color: #555;
            font-size: 0.9em;
        }

        .error-message {
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .error-message p {
            color: #666;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .error-message p:first-child {
            color: #f5576c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 POKÉDEX 🔴</h1>
            <p>Busca tu Pokémon favorito y descubre sus características</p>
        </div>

        <div class="search-box">
            <input 
                type="text" 
                id="pokemon-input" 
                placeholder="Ej: pikachu, charizard, dragonite..."
                autocomplete="off"
            >
            <button class="search-btn" onclick="buscarPokemon()">Buscar</button>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>Buscando Pokémon...</p>
        </div>

        <div id="pokemon-card"></div>
    </div>

    <script src="api.js"></script>
</body>
</html>
