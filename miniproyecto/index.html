<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSearch - Buscador de Películas y Series</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            padding: 0;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(229, 9, 20, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 165, 0, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.6s ease-out;
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.8) 0%, transparent 100%);
            border-bottom: 2px solid rgba(229, 9, 20, 0.3);
        }

        header h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(229, 9, 20, 0.8);
            background: linear-gradient(135deg, #e50914 0%, #ff6b6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.8;
            color: #ccc;
            letter-spacing: 1px;
        }

        .search-section {
            background: rgba(20, 20, 20, 0.8);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(229, 9, 20, 0.2);
            margin-bottom: 40px;
            animation: slideUp 0.6s ease-out;
            border: 1px solid rgba(229, 9, 20, 0.2);
            backdrop-filter: blur(10px);
        }

        .search-container {
            display: grid;
            grid-template-columns: 1fr 200px 150px;
            gap: 15px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            padding: 14px 18px;
            border: 2px solid rgba(229, 9, 20, 0.3);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            background: rgba(30, 30, 30, 0.9);
            color: white;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #e50914;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
            background: rgba(40, 40, 40, 0.9);
        }

        select {
            padding: 14px 18px;
            border: 2px solid rgba(229, 9, 20, 0.3);
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            background: rgba(30, 30, 30, 0.9);
            color: white;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #e50914;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #e50914 0%, #c4070c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.6);
            background: linear-gradient(135deg, #ff3333 0%, #e50914 100%);
        }

        button:active {
            transform: scale(0.98);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .filters p {
            grid-column: 1 / -1;
            color: #ccc;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .filter-btn {
            padding: 10px 16px;
            background: rgba(50, 50, 50, 0.8);
            color: #ccc;
            border: 2px solid rgba(229, 9, 20, 0.3);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover {
            border-color: #e50914;
            color: #fff;
            background: rgba(60, 60, 60, 0.9);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #e50914 0%, #c4070c 100%);
            color: white;
            border-color: #e50914;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 60px 40px;
        }

        .spinner {
            border: 4px solid rgba(229, 9, 20, 0.2);
            border-top: 4px solid #e50914;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .results-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        .movie-card {
            background: rgba(30, 30, 30, 0.8);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            border: 1px solid rgba(229, 9, 20, 0.2);
            position: relative;
        }

        .movie-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.2) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2;
            pointer-events: none;
        }

        .movie-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 16px 40px rgba(229, 9, 20, 0.4);
            border-color: #e50914;
        }

        .movie-card:hover::before {
            opacity: 1;
        }

        .movie-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }

        .movie-info {
            padding: 15px;
            background: rgba(20, 20, 20, 0.9);
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .movie-type {
            display: inline-block;
            background: linear-gradient(135deg, #e50914 0%, #c4070c 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .movie-year {
            color: #999;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stars {
            color: #ff9500;
            font-size: 0.95rem;
        }

        .rating-value {
            background: rgba(229, 9, 20, 0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .no-poster {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.3) 0%, rgba(255, 99, 99, 0.2) 100%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 3rem;
            font-weight: bold;
        }

        .error-message {
            background: linear-gradient(135deg, #e50914 0%, #c4070c 100%);
            color: white;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            animation: slideDown 0.3s ease-out;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .success-message {
            background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
            color: white;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            animation: slideDown 0.3s ease-out;
            font-weight: 600;
            border: 1px solid rgba(30, 215, 96, 0.3);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            padding: 60px 40px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }

            .search-container {
                grid-template-columns: 1fr;
            }

            .results-section {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Cine CHE </h1>
            <p>Tu buscador de películas y series favoritas</p>
        </header>

        <div class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Busca una película o serie...">
                <select id="typeFilter">
                    <option value="">Todos los tipos</option>
                    <option value="movie">Películas</option>
                    <option value="series">Series</option>
                </select>
                <button onclick="searchMovies()">Buscar</button>
            </div>

            <div>
                <p style="margin-bottom: 10px; color: #666; font-weight: bold;">Géneros Populares:</p>
                <div class="filters">
                    <button class="filter-btn" onclick="filterByGenre('action', this)">Acción</button>
                    <button class="filter-btn" onclick="filterByGenre('comedy', this)">Comedia</button>
                    <button class="filter-btn" onclick="filterByGenre('drama', this)">Drama</button>
                    <button class="filter-btn" onclick="filterByGenre('horror', this)">Terror</button>
                    <button class="filter-btn" onclick="filterByGenre('romance', this)">Romance</button>
                    <button class="filter-btn" onclick="filterByGenre('sci-fi', this)">Ciencia Ficción</button>
                    <button class="filter-btn" onclick="filterByGenre('thriller', this)">Suspenso</button>
                    <button class="filter-btn" onclick="filterByGenre('animation', this)">Animación</button>
                </div>
            </div>
        </div>

        <div id="messageContainer"></div>
        <div id="loadingContainer"></div>
        <div id="resultsContainer" class="results-section"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
