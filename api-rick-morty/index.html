<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty - Personajes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
            background-attachment: fixed;
            padding: 20px;
            color: #00ffff;
            min-height: 100vh;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        h1 {
            background: linear-gradient(90deg, #ff0080, #00ffff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
            letter-spacing: 2px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        #searchInput {
            padding: 12px 15px;
            border: 2px solid #00ffff;
            border-radius: 5px;
            font-size: 1rem;
            width: 300px;
            transition: all 0.3s ease;
            background-color: rgba(10, 14, 39, 0.8);
            color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        #searchInput::placeholder {
            color: rgba(0, 255, 255, 0.5);
        }

        #searchInput:focus {
            outline: none;
            border-color: #ff0080;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.6), inset 0 0 10px rgba(255, 0, 128, 0.1);
            background-color: rgba(10, 14, 39, 0.95);
        }

        #searchBtn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff0080, #00ffff);
            color: #000;
            border: 2px solid #ff0080;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
        }

        #searchBtn:hover {
            background: linear-gradient(135deg, #00ffff, #ff0080);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 50px rgba(255, 0, 128, 0.6);
            transform: scale(1.05);
        }

        #searchBtn:active {
            transform: scale(0.95);
        }

        #container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(135deg, rgba(15, 20, 50, 0.9), rgba(50, 10, 60, 0.9));
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #ff0080, #00ffff) 1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.3), 0 0 40px rgba(0, 255, 255, 0.2);
            padding: 0;
            transition: all 0.3s ease;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 128, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.6), 0 0 60px rgba(0, 255, 255, 0.4);
            border-image: linear-gradient(135deg, #00ffff, #ff0080, #00ffff) 1;
        }

        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            filter: brightness(1.1) contrast(1.1);
            transition: filter 0.3s ease;
        }

        .card:hover .card-image {
            filter: brightness(1.3) contrast(1.2);
        }

        .card-content {
            padding: 15px;
        }

        .card-name {
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(90deg, #00ffff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-info {
            font-size: 0.95rem;
            color: #00ffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .card-info strong {
            color: #ff0080;
            margin-right: 5px;
            text-shadow: 0 0 5px rgba(255, 0, 128, 0.8);
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status.alive {
            background-color: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border: 2px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        }

        .status.dead {
            background-color: rgba(255, 0, 128, 0.2);
            color: #ff0080;
            border: 2px solid #ff0080;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.6);
        }

        .status.unknown {
            background-color: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border: 2px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 1.2rem;
            color: #00ffff;
            grid-column: 1 / -1;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .error {
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.2), rgba(255, 0, 0, 0.1));
            color: #ff0080;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            grid-column: 1 / -1;
            border: 2px solid #ff0080;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            font-size: 1.1rem;
            color: #00ffff;
            grid-column: 1 / -1;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }

        /* Media queries para responsive */
        @media (max-width: 768px) {
            #container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            #searchInput {
                width: 100%;
                max-width: 100%;
            }

            .search-container {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            #container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }

            .search-container {
                flex-direction: column;
            }

            #searchInput,
            #searchBtn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Rick and Morty - Personajes</h1>
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Buscar personaje por nombre..."
                autocomplete="off"
            >
            <button id="searchBtn">Buscar</button>
        </div>
    </div>

    <div id="container"></div>

    <script src="api.js"></script>
</body>
</html>
